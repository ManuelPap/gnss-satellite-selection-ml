[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnss-satellite-selection-ml"
version = "0.1.0"
description = "Independent experiments for differentiable GNSS positioning and satellite selection"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pymap3d>=3.2",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires external scientific data and the validated disposable runtime",
]
